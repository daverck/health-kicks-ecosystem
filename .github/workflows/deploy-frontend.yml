name: Deploy Frontend (Angular to S3 + CloudFront)

on:
  push:
    branches:
      - main
    paths:
      - 'health-kicks-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy Angular SPA to S3 + CloudFront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-kicks-frontend

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: health-kicks-frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter and Unit Tests
        run: |
          pnpm run lint
          pnpm run test:ci

      - name: Build Production Angular SPA
        run: pnpm run build --configuration production

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::693906847467:role/healthkicks-github-actions-deploy-role
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Sync Static Assets to S3 (Immutable 1-Year Cache)
        run: |
          aws s3 sync dist/health-kicks-app/browser/ s3://healthkicks-frontend-app-693906847467 \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Copy index.html to S3 (No-Cache / Must-Revalidate)
        run: |
          aws s3 cp dist/health-kicks-app/browser/index.html s3://healthkicks-frontend-app-693906847467/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Edge Cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='HealthKicks Angular SPA Distribution'].Id" --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for Distribution: $DIST_ID"
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "CloudFront distribution not found, skipping invalidation."
          fi
