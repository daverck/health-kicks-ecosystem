name: OpenTofu - Infrastructure as Code CI

on:
  push:
    branches: [main]
    paths:
      - "infra/tofu/**"
      - ".github/workflows/tofu-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/tofu/**"
      - ".github/workflows/tofu-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu-check:
    name: OpenTofu Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"

      - name: Check OpenTofu Formatting
        run: tofu fmt -check -recursive infra/tofu

      - name: OpenTofu Init (Offline Validation Mode)
        working-directory: infra/tofu/environments/production
        run: tofu init -backend=false

      - name: OpenTofu Validate Configuration
        working-directory: infra/tofu/environments/production
        run: tofu validate
