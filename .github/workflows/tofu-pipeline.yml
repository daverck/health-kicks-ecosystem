name: OpenTofu - Infrastructure as Code CI/CD

on:
  push:
    branches: [main]
    paths:
      - "infra/tofu/**"
      - ".github/workflows/tofu-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/tofu/**"
      - ".github/workflows/tofu-pipeline.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  tofu-check:
    name: OpenTofu Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"

      - name: Check OpenTofu Formatting
        run: tofu fmt -check -recursive infra/tofu

      - name: OpenTofu Init (Offline Validation Mode)
        working-directory: infra/tofu/environments/production
        run: tofu init -backend=false

      - name: OpenTofu Validate Configuration
        working-directory: infra/tofu/environments/production
        run: tofu validate

  tofu-plan:
    name: OpenTofu Plan (Requires AWS Remote State)
    needs: tofu-check
    if: ${{ secrets.AWS_OIDC_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tofu/environments/production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan (Dry-run)
        id: plan
        run: |
          tofu plan -no-color -out=tfplan
