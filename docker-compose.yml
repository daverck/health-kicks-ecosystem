services:
  postgres:
    image: postgres:16-alpine
    container_name: healthkicks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: healthkicks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthkicks"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: healthkicks-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,iot
      - AWS_DEFAULT_REGION=eu-north-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: healthkicks-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    command: mosquitto -c /mosquitto-no-auth.conf

  backend:
    build:
      context: ./health-kicks
      dockerfile: Dockerfile
    container_name: healthkicks-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/healthkicks
      DATABASE_SSLMODE: disable
      DYNAMODB_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: mock-access-key
      AWS_SECRET_ACCESS_KEY: mock-secret-key
      HEALTHKICKS_JWT_SECRET: dev-secret-for-docker-compose-minimum-32-chars-long
      HEALTHKICKS_INGEST_TOKEN: dev-ingest-token-healthkicks-local-12345
      HEALTHKICKS_ENVIRONMENT: development
      HEALTHKICKS_AUTO_CREATE_TABLES: "false"
      MIGRATE_ON_START: "true"
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./health-kicks-frontend
      dockerfile: Dockerfile
    container_name: healthkicks-frontend
    restart: unless-stopped
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
  localstack_data:
