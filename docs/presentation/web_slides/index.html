<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthKicks - Présentation Officielle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090d16;
      --surface-dark: #0f172a;
      --surface-card: #1e293b;
      --primary-blue: #2563eb;
      --primary-teal: #0d9488;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header.viewer-header {
      background: var(--surface-dark);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-teal));
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .presentation-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-white);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--surface-card);
      color: var(--text-white);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary {
      background: var(--primary-blue);
      border-color: transparent;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* Main Presentation Stage */
    main.viewer-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
    }

    .slide-viewport {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-subtle);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      transition: opacity 0.2s ease-in-out;
    }

    .slide-img.active {
      display: block;
    }

    /* Floating Navigation Controls */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-subtle);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      z-index: 20;
    }

    .nav-arrow:hover {
      background: var(--primary-blue);
      border-color: transparent;
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow.prev { left: 16px; }
    .nav-arrow.next { right: 16px; }

    .nav-arrow:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface-dark);
      border: 1px solid var(--border-subtle);
      padding: 8px 20px;
      border-radius: 30px;
    }

    .counter-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .counter-badge strong {
      color: var(--text-white);
      font-size: 14px;
    }

    .shortcuts-hint {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key {
      display: inline-block;
      padding: 2px 6px;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
    }

    /* Thumbnails Carousel */
    .thumbnails-strip {
      background: var(--surface-dark);
      border-top: 1px solid var(--border-subtle);
      padding: 14px 20px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-card) transparent;
      justify-content: center;
    }

    .thumb-item {
      flex: 0 0 130px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.55;
      transition: all 0.2s ease;
      position: relative;
      background: #000;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .thumb-item.active {
      border-color: var(--primary-teal);
      opacity: 1;
      box-shadow: 0 0 12px rgba(13, 148, 136, 0.4);
    }

    .thumb-num {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
    }

    /* Fullscreen Mode */
    body.is-fullscreen header.viewer-header,
    body.is-fullscreen .thumbnails-strip {
      display: none !important;
    }

    body.is-fullscreen main.viewer-stage {
      padding: 0;
      height: 100vh;
      justify-content: center;
    }

    body.is-fullscreen .slide-viewport {
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }

    body.is-fullscreen .bottom-bar {
      position: absolute;
      bottom: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
    }

    body.is-fullscreen main.viewer-stage:hover .bottom-bar {
      opacity: 1;
    }

    @media (max-width: 768px) {
      header.viewer-header { padding: 10px 14px; }
      .brand-badge, .shortcuts-hint { display: none; }
      .nav-arrow { width: 40px; height: 40px; }
      .nav-arrow.prev { left: 8px; }
      .nav-arrow.next { right: 8px; }
      .thumbnails-strip { justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="viewer-header">
    <div class="brand-section">
      <span class="brand-badge">PROJET HEALTHKICKS</span>
      <h1 class="presentation-title">Présentation Soutenance IoT & IA Embarquée</h1>
    </div>
    <div class="header-actions">
      <a href="../presentation_healthkicks.pdf" download="HealthKicks_Presentation.pdf" class="btn" title="Télécharger le PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>PDF</span>
      </a>
      <button class="btn btn-primary" id="fullscreenBtn" title="Plein écran">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span>Plein Écran</span>
      </button>
    </div>
  </header>

  <!-- Presentation Stage -->
  <main class="viewer-stage" id="stage">
    <div class="slide-viewport" id="viewport">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Slide précédente">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img src="slides/slide_1.webp" class="slide-img active" data-index="1" alt="Slide 1" loading="lazy" />
      <img src="slides/slide_2.webp" class="slide-img" data-index="2" alt="Slide 2" loading="lazy" />
      <img src="slides/slide_3.webp" class="slide-img" data-index="3" alt="Slide 3" loading="lazy" />
      <img src="slides/slide_4.webp" class="slide-img" data-index="4" alt="Slide 4" loading="lazy" />
      <img src="slides/slide_5.webp" class="slide-img" data-index="5" alt="Slide 5" loading="lazy" />
      <img src="slides/slide_6.webp" class="slide-img" data-index="6" alt="Slide 6" loading="lazy" />
      <img src="slides/slide_7.webp" class="slide-img" data-index="7" alt="Slide 7" loading="lazy" />
      <img src="slides/slide_8.webp" class="slide-img" data-index="8" alt="Slide 8" loading="lazy" />
      <img src="slides/slide_9.webp" class="slide-img" data-index="9" alt="Slide 9" loading="lazy" />
      <img src="slides/slide_10.webp" class="slide-img" data-index="10" alt="Slide 10" loading="lazy" />
      <img src="slides/slide_11.webp" class="slide-img" data-index="11" alt="Slide 11" loading="lazy" />
      <img src="slides/slide_12.webp" class="slide-img" data-index="12" alt="Slide 12" loading="lazy" />
      <img src="slides/slide_13.webp" class="slide-img" data-index="13" alt="Slide 13" loading="lazy" />
      <button class="nav-arrow next" id="nextBtn" aria-label="Slide suivante">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
      <div class="counter-badge">
        Slide <strong id="currentSlideNum">1</strong> / <span>13</span>
      </div>
      <div class="shortcuts-hint">
        <span class="key">←</span> <span class="key">→</span> Clavier
        <span style="opacity: 0.3">|</span>
        <span class="key">F</span> Plein écran
      </div>
    </div>
  </main>

  <!-- Thumbnails Strip -->
  <div class="thumbnails-strip" id="thumbsStrip">
    <div class="thumb-item active" data-target="1">
      <img src="thumbs/thumb_1.webp" alt="Miniature 1" loading="lazy" />
      <span class="thumb-num">1</span>
    </div>
    <div class="thumb-item" data-target="2">
      <img src="thumbs/thumb_2.webp" alt="Miniature 2" loading="lazy" />
      <span class="thumb-num">2</span>
    </div>
    <div class="thumb-item" data-target="3">
      <img src="thumbs/thumb_3.webp" alt="Miniature 3" loading="lazy" />
      <span class="thumb-num">3</span>
    </div>
    <div class="thumb-item" data-target="4">
      <img src="thumbs/thumb_4.webp" alt="Miniature 4" loading="lazy" />
      <span class="thumb-num">4</span>
    </div>
    <div class="thumb-item" data-target="5">
      <img src="thumbs/thumb_5.webp" alt="Miniature 5" loading="lazy" />
      <span class="thumb-num">5</span>
    </div>
    <div class="thumb-item" data-target="6">
      <img src="thumbs/thumb_6.webp" alt="Miniature 6" loading="lazy" />
      <span class="thumb-num">6</span>
    </div>
    <div class="thumb-item" data-target="7">
      <img src="thumbs/thumb_7.webp" alt="Miniature 7" loading="lazy" />
      <span class="thumb-num">7</span>
    </div>
    <div class="thumb-item" data-target="8">
      <img src="thumbs/thumb_8.webp" alt="Miniature 8" loading="lazy" />
      <span class="thumb-num">8</span>
    </div>
    <div class="thumb-item" data-target="9">
      <img src="thumbs/thumb_9.webp" alt="Miniature 9" loading="lazy" />
      <span class="thumb-num">9</span>
    </div>
    <div class="thumb-item" data-target="10">
      <img src="thumbs/thumb_10.webp" alt="Miniature 10" loading="lazy" />
      <span class="thumb-num">10</span>
    </div>
    <div class="thumb-item" data-target="11">
      <img src="thumbs/thumb_11.webp" alt="Miniature 11" loading="lazy" />
      <span class="thumb-num">11</span>
    </div>
    <div class="thumb-item" data-target="12">
      <img src="thumbs/thumb_12.webp" alt="Miniature 12" loading="lazy" />
      <span class="thumb-num">12</span>
    </div>
    <div class="thumb-item" data-target="13">
      <img src="thumbs/thumb_13.webp" alt="Miniature 13" loading="lazy" />
      <span class="thumb-num">13</span>
    </div>
  </div>

  <script>
    let currentSlide = 1;
    const totalSlides = 13;
    const slides = document.querySelectorAll('.slide-img');
    const thumbs = document.querySelectorAll('.thumb-item');
    const currentNumEl = document.getElementById('currentSlideNum');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function goToSlide(num) {
      if (num < 1) num = 1;
      if (num > totalSlides) num = totalSlides;
      currentSlide = num;

      slides.forEach(img => {
        if (parseInt(img.getAttribute('data-index')) === currentSlide) {
          img.classList.add('active');
        } else {
          img.classList.remove('active');
        }
      });

      thumbs.forEach(t => {
        if (parseInt(t.getAttribute('data-target')) === currentSlide) {
          t.classList.add('active');
          t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          t.classList.remove('active');
        }
      });

      currentNumEl.textContent = currentSlide;
      prevBtn.disabled = (currentSlide === 1);
      nextBtn.disabled = (currentSlide === totalSlides);
    }

    prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1));

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        const target = parseInt(thumb.getAttribute('data-target'));
        goToSlide(target);
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
        goToSlide(currentSlide - 1);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
        goToSlide(currentSlide + 1);
      } else if (e.key === 'Home') {
        goToSlide(1);
      } else if (e.key === 'End') {
        goToSlide(totalSlides);
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Touch swipe support
    let touchStartX = 0;
    const viewport = document.getElementById('viewport');
    viewport.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    viewport.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].screenX;
      let diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 40) {
        if (diff > 0) goToSlide(currentSlide + 1);
        else goToSlide(currentSlide - 1);
      }
    }, { passive: true });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.body.classList.add('is-fullscreen');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        document.body.classList.remove('is-fullscreen');
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('is-fullscreen');
      }
    });

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    goToSlide(1);
  </script>
</body>
</html>
